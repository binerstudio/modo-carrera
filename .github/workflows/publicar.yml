# Publica MODO CARRERA en Cloudflare Pages (proyecto carreramod0).
# - Push a main      -> producción (carreramod0.pages.dev)
# - Push a otra rama -> vista previa (<rama>.carreramod0.pages.dev), no toca producción
# Secretos necesarios en GitHub: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID
name: Publicar en Cloudflare Pages

on:
  push:
  workflow_dispatch:

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Preparar carpeta del sitio (sin archivos internos del repositorio)
        run: |
          mkdir _sitio
          rsync -a --exclude '.git' --exclude '.github' --exclude '_sitio' ./ _sitio/

      - name: Publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _sitio --project-name=carreramod0 --branch=${{ github.ref_name }} --commit-dirty=true
