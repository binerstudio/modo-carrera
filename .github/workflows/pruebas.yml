name: Pruebas de regresión
on:
  push:
  workflow_dispatch:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Servidor local
        run: (python3 -m http.server 8080 >/dev/null 2>&1 &) && sleep 2
      - name: Jugar temporadas con semilla fija
        run: node tests/regresion.mjs http://localhost:8080/index.html ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: resultados, path: tests/out/ }
