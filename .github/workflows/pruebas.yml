name: Pruebas de regresión
on:
  push:
  workflow_dispatch:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: _base }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Servidores locales
        run: |
          (python3 -m http.server 8080 >/dev/null 2>&1 &)
          mkdir -p /tmp/srvroot && ln -sfn "$PWD/_base" /tmp/srvroot/app
          (cd /tmp/srvroot && python3 -m http.server 8081 >/dev/null 2>&1 &)
          sleep 2
      - name: Motor v2 · validación masiva (miles de partidos)
        run: node tests/motor.mjs 1000
      - name: Jugar temporadas con semilla fija
        run: node tests/regresion.mjs http://localhost:8080/index.html ${{ github.ref_name }}
      - name: Simulador 2D en vivo (capturas en el artefacto)
        run: node tests/partido2d.mjs http://localhost:8080/index.html
      - name: Tres temporadas sin intervención (IA y mercado)
        run: node tests/temporadas.mjs http://localhost:8080/index.html 3
      - name: Carrera guardada con la versión publicada (main) se abre con esta versión
        run: node tests/actualizacion.mjs http://localhost:8081/app/index.html /tmp/srvroot/app "$PWD/_base" "$PWD"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: resultados, path: tests/out/ }
